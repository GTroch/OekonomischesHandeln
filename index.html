<title>Ökonomisches Handeln</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f7f5ef; --bg-alt:#eef1ea; --surface:#ffffff; --surface-alt:#eef4ef;
    --ink:#16241f; --ink-2:#4b5851; --ink-mute:#7c887f;
    --accent:#1f5c4a; --accent-strong:#153d31; --accent-soft:#e3efe8;
    --amber:#a3740f; --amber-strong:#7a5709; --amber-soft:#fbf1da;
    --border:#dfe1d8; --border-strong:#c7cec4;
    --chip-arbeit-bg:#dfe9e3; --chip-arbeit-fg:#1c4a3c;
    --chip-disk-bg:#f4e6c8; --chip-disk-fg:#7a5709;
    --shadow:0 1px 2px rgba(22,36,31,.06), 0 8px 24px rgba(22,36,31,.06);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0f1713; --bg-alt:#131b17; --surface:#171f1a; --surface-alt:#1b2621;
      --ink:#edf2ee; --ink-2:#b7c2bb; --ink-mute:#84907f;
      --accent:#57b592; --accent-strong:#82d8b8; --accent-soft:#1c352c;
      --amber:#e3bb5e; --amber-strong:#f0d38c; --amber-soft:#2c2415;
      --border:#28322b; --border-strong:#37423a;
      --chip-arbeit-bg:#1c352c; --chip-arbeit-fg:#8fd7bb;
      --chip-disk-bg:#332a14; --chip-disk-fg:#e3bb5e;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0f1713; --bg-alt:#131b17; --surface:#171f1a; --surface-alt:#1b2621;
    --ink:#edf2ee; --ink-2:#b7c2bb; --ink-mute:#84907f;
    --accent:#57b592; --accent-strong:#82d8b8; --accent-soft:#1c352c;
    --amber:#e3bb5e; --amber-strong:#f0d38c; --amber-soft:#2c2415;
    --border:#28322b; --border-strong:#37423a;
    --chip-arbeit-bg:#1c352c; --chip-arbeit-fg:#8fd7bb;
    --chip-disk-bg:#332a14; --chip-disk-fg:#e3bb5e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink);}
  h1,h2,h3,.display{font-family:"Fraunces",Georgia,"Times New Roman",serif; text-wrap:balance;}
  body,input,button{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;}

  a{color:inherit;}
  button{font:inherit; cursor:pointer;}

  .app{display:flex; min-height:100%; max-width:1400px; margin:0 auto;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; gap:14px;
  }
  .topbar .brand{display:flex; align-items:baseline; gap:10px; flex:1; min-width:0;}
  .topbar .brand .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); white-space:nowrap;}
  .topbar h1{font-size:19px; margin:0; font-weight:600; color:var(--accent-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .progress-wrap{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .progress-track{width:96px; height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .3s ease;}
  .progress-label{font-size:12px; color:var(--ink-2); white-space:nowrap;}
  .menu-btn{display:none; border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:8px 10px; color:var(--ink);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px; flex-shrink:0; border-right:1px solid var(--border);
    padding:16px 14px 40px; overflow-y:auto;
    position:sticky; top:57px; align-self:flex-start;
    height:calc(100vh - 57px);
  }
  .search{
    width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px; margin-bottom:14px;
  }
  .search:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .nav-overview-btn{
    width:100%; text-align:left; padding:9px 12px; border-radius:9px; border:1px solid transparent;
    background:transparent; color:var(--ink-2); font-size:13.5px; font-weight:600; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .nav-overview-btn.active, .nav-overview-btn:hover{background:var(--accent-soft); color:var(--accent-strong);}
  .block-group{margin-bottom:6px;}
  .block-head{
    display:flex; align-items:center; gap:8px; padding:10px 8px 6px;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-mute); font-weight:700;
  }
  .block-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .lesson-item{
    display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left;
    padding:8px 8px; border-radius:9px; border:1px solid transparent; background:transparent;
    color:var(--ink); margin-bottom:2px;
  }
  .lesson-item:hover{background:var(--surface-alt);}
  .lesson-item.active{background:var(--accent-soft); border-color:var(--border-strong);}
  .lesson-nr{
    font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink-mute);
    width:20px; flex-shrink:0; padding-top:2px;
  }
  .lesson-item.active .lesson-nr{color:var(--accent-strong); font-weight:700;}
  .lesson-title{font-size:13.5px; line-height:1.35; flex:1;}
  .lesson-check{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--border-strong);
    flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center;
    background:var(--surface);
  }
  .lesson-check.done{background:var(--accent); border-color:var(--accent);}
  .lesson-check.done::after{content:"✓"; color:#fff; font-size:11px; line-height:1;}
  .lesson-item.done .lesson-title{color:var(--ink-mute); text-decoration:line-through; text-decoration-color:var(--border-strong);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:28px 34px 80px;}
  .hero{margin-bottom:30px;}
  .hero .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:700; margin-bottom:10px;}
  .hero h1{font-size:clamp(28px,4vw,42px); margin:0 0 12px; color:var(--accent-strong); font-weight:600;}
  .hero p.lead{font-size:16px; color:var(--ink-2); max-width:66ch; line-height:1.6; margin:0 0 4px;}
  .meta-row{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:18px; font-size:13px; color:var(--ink-2);}
  .meta-row div{display:flex; gap:6px;}
  .meta-row b{color:var(--ink); font-weight:600;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:22px 24px; box-shadow:var(--shadow); margin-bottom:20px;
  }
  .card h2{font-size:17px; margin:0 0 14px; color:var(--accent-strong); font-weight:600;}
  .card ul{margin:0; padding-left:20px; color:var(--ink-2); font-size:14.5px; line-height:1.65;}
  .card ul li{margin-bottom:8px;}
  .card ul li b{color:var(--ink);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

  .structure-row{display:flex; gap:14px; flex-wrap:wrap;}
  .structure-item{
    flex:1; min-width:180px; background:var(--surface-alt); border:1px solid var(--border);
    border-radius:12px; padding:16px;
  }
  .structure-item .num{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--accent); font-weight:700;}
  .structure-item h3{font-size:14.5px; margin:6px 0 6px; color:var(--ink); font-weight:700;}
  .structure-item p{font-size:13px; color:var(--ink-2); margin:0; line-height:1.5;}

  /* chart */
  .chart-bar{display:flex; width:100%; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--border); margin-bottom:4px;}
  .chart-seg{display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-size:12px; color:#fff; font-weight:700; position:relative;}
  .chart-seg + .chart-seg{border-left:2px solid var(--bg);}
  .legend-row{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;}
  .legend-item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2);}
  .legend-swatch{width:10px; height:10px; border-radius:3px; flex-shrink:0;}

  /* lesson detail */
  .lesson-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .lesson-head-left .block-tag{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .lesson-head h1{font-size:clamp(22px,3.2vw,30px); margin:0; color:var(--accent-strong); font-weight:600; line-height:1.2;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:700;}
  .badge.arbeit{background:var(--chip-arbeit-bg); color:var(--chip-arbeit-fg);}
  .badge.disk{background:var(--chip-disk-bg); color:var(--chip-disk-fg);}
  .time-chips{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .time-chip{
    font-family:"JetBrains Mono",monospace; font-size:12px; padding:6px 10px; border-radius:8px;
    background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-2);
  }

  .info-card{display:grid; grid-template-columns:170px 1fr; gap:10px 18px; font-size:14px;}
  .info-card dt{color:var(--accent); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; padding-top:2px;}
  .info-card dd{margin:0; color:var(--ink); line-height:1.55;}
  @media (max-width:600px){.info-card{grid-template-columns:1fr;} .info-card dt{padding-top:10px;}}

  .flow{display:flex; flex-direction:column; gap:0; margin-top:4px;}
  .flow-step{display:flex; gap:16px; position:relative; padding-bottom:26px;}
  .flow-step:last-child{padding-bottom:0;}
  .flow-rail{display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:38px;}
  .flow-dot{width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:12px; border:1px solid var(--border-strong);}
  .flow-line{flex:1; width:2px; background:var(--border); margin:4px 0;}
  .flow-body{flex:1; padding-top:4px;}
  .flow-body h3{margin:0 0 6px; font-size:15.5px; color:var(--ink); font-weight:700;}
  .flow-body .flow-meta{font-size:12px; color:var(--ink-mute); margin-bottom:8px; font-family:"JetBrains Mono",monospace;}
  .flow-body p{margin:0; font-size:14.5px; line-height:1.65; color:var(--ink-2);}

  .tafelbild-wrap{background:var(--surface-alt); border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:8px;}
  .tafelbild-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-mute); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .tafel-boxes{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .tafel-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px;}
  .tafel-box h4{margin:0 0 8px; font-size:13.5px; color:var(--accent-strong); font-weight:700;}
  .tafel-box ul{margin:0; padding-left:16px; font-size:13px; color:var(--ink-2); line-height:1.55;}
  .tafel-box ul li{margin-bottom:4px;}
  .merksatz{
    margin-top:14px; background:var(--amber-soft); border-left:4px solid var(--amber);
    border-radius:0 8px 8px 0; padding:12px 16px; font-size:13.5px; color:var(--amber-strong); font-style:italic; line-height:1.55;
  }
  .merksatz b{font-style:normal;}

  .material-list{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .material-item{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--ink-2); line-height:1.5;}
  .material-item svg{flex-shrink:0; margin-top:3px; color:var(--ink-mute);}

  .hw{margin-top:20px; padding:14px 16px; border:1px dashed var(--border-strong); border-radius:10px; font-size:13.5px; color:var(--ink-2);}
  .hw b{color:var(--ink);}

  .pager{display:flex; justify-content:space-between; gap:12px; margin-top:30px;}
  .pager button{
    flex:1; max-width:280px; padding:12px 16px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px; text-align:left; box-shadow:var(--shadow);
  }
  .pager button:hover{border-color:var(--accent);}
  .pager button:disabled{opacity:.35; pointer-events:none;}
  .pager .lbl{font-size:11px; color:var(--ink-mute); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px;}
  .pager .next{text-align:right; margin-left:auto;}

  .taught-toggle{
    display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:10px;
    border:1px solid var(--border-strong); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-2);
  }
  .taught-toggle.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  [hidden]{display:none !important;}

  @media (max-width:520px){
    .topbar .eyebrow{display:none;}
    .topbar h1{font-size:15.5px;}
    .progress-track{width:54px;}
    .progress-label{font-size:11px;}
    .topbar{padding:12px 14px; gap:10px;}
  }
  @media (max-width:880px){
    .menu-btn{display:inline-flex; align-items:center; gap:6px;}
    .sidebar{
      position:fixed; top:57px; left:0; bottom:0; z-index:30; background:var(--bg);
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 0 100vmax rgba(0,0,0,0); width:82vw; max-width:340px;
    }
    .sidebar.open{transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,.15);}
    .main{padding:22px 18px 70px;}
    .info-card{font-size:13.5px;}
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">

    <div id="navList"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("lessons-data").textContent);
  var STUNDEN = DATA.stunden;
  var KURS = DATA.kurs;
  var BLOCK_COLOR = {A:"var(--s1)", B:"var(--s2)", C:"var(--s3)", D:"var(--s4)"};
  var BLOCK_COLOR_HEX_LIGHT = {A:"#2a78d6", B:"#eb6834", C:"#1baf7a", D:"#eda100"};

  var state = { view: "overview", lessonNr: null, taught: {}, query: "" };

  // ---- persistence (per-viewer convenience only) ----
  function loadTaught(){
    try{
      var raw = localStorage.getItem("wr10-oek-taught");
      if(raw) state.taught = JSON.parse(raw) || {};
    }catch(e){ state.taught = {}; }
  }
  function saveTaught(){
    try{ localStorage.setItem("wr10-oek-taught", JSON.stringify(state.taught)); }catch(e){}
  }
  loadTaught();

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function findLesson(nr){
    for(var i=0;i<STUNDEN.length;i++){ if(STUNDEN[i].nr === nr) return STUNDEN[i]; }
    return null;
  }

  function blockTitle(id){
    for(var i=0;i<KURS.bloecke.length;i++){ if(KURS.bloecke[i].id===id) return KURS.bloecke[i]; }
    return null;
  }

  function taughtCount(){
    var c=0; STUNDEN.forEach(function(s){ if(state.taught[s.nr]) c++; }); return c;
  }

  function matchesQuery(s, q){
    if(!q) return true;
    q = q.toLowerCase();
    var hay = [s.titel, s.kompetenzbezug, s.lernziel].concat(s.lehrplan_inhalte||[]).join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  // ---------------- Sidebar ----------------
  function renderSidebar(){
    var nav = document.getElementById("navList");
    var html = "";
    KURS.bloecke.forEach(function(b){
      var items = STUNDEN.filter(function(s){ return s.block===b.id; });
      var visible = items.filter(function(s){ return matchesQuery(s, state.query); });
      if(state.query && visible.length===0) return;
      html += '<div class="block-group">';
      html += '<div class="block-head"><span class="block-dot" style="background:'+BLOCK_COLOR[b.id]+'"></span>Block '+b.id+' · '+esc(b.titel)+'</div>';
      (state.query ? visible : items).forEach(function(s){
        var active = (state.view==="lesson" && state.lessonNr===s.nr);
        var done = !!state.taught[s.nr];
        html += '<button class="lesson-item'+(active?" active":"")+(done?" done":"")+'" data-nr="'+s.nr+'">'
          + '<span class="lesson-nr">'+String(s.nr).padStart(2,"0")+'</span>'
          + '<span class="lesson-title">'+esc(s.titel)+'</span>'
          + '<span class="lesson-check'+(done?" done":"")+'" data-check="'+s.nr+'"></span>'
          + '</button>';
      });
      html += '</div>';
    });
    nav.innerHTML = html;

    nav.querySelectorAll(".lesson-item").forEach(function(btn){
      btn.addEventListener("click", function(e){
        if(e.target.hasAttribute("data-check")){
          var nr = +e.target.getAttribute("data-check");
          state.taught[nr] = !state.taught[nr];
          saveTaught();
          renderSidebar(); if(state.view==="lesson" && state.lessonNr===nr) renderMain();
          return;
        }
        var nr = +btn.getAttribute("data-nr");
        state.view="lesson"; state.lessonNr=nr;
        renderSidebar(); renderMain();
        closeSidebarMobile();
        window.scrollTo({top:0,behavior:"smooth"});
      });
    });

    document.getElementById("overviewBtn").classList.toggle("active", state.view==="overview");
  }

  // ---------------- Overview ----------------
  function renderOverview(){
    var total = STUNDEN.length;
    var chartSegs = "";
    var legend = "";
    KURS.bloecke.forEach(function(b){
      var count = STUNDEN.filter(function(s){return s.block===b.id;}).length;
      var pct = (count/total*100).toFixed(1);
      chartSegs += '<div class="chart-seg" style="width:'+pct+'%; background:'+BLOCK_COLOR[b.id]+'">'+count+'</div>';
      legend += '<div class="legend-item"><span class="legend-swatch" style="background:'+BLOCK_COLOR[b.id]+'"></span>Block '+b.id+' — '+esc(b.titel)+' ('+count+' Std.)</div>';
    });

    var kompHtml = KURS.kompetenzerwartungen.map(function(k){ return "<li>"+esc(k)+"</li>"; }).join("");

    var html = ''
    +'<div class="hero">'
      +'<div class="eyebrow">Unterrichtsskript · '+esc(KURS.fach)+' · Jahrgangsstufe '+esc(KURS.jahrgangsstufe)+'</div>'
      +'<h1>Ökonomisches Handeln auf dem Markt</h1>'
      +'<p class="lead">18 Unterrichtseinheiten à 45 Minuten für den Lehrplan-Lernbereich „'+esc(KURS.lernbereich)+'". Jede Stunde führt in ein neues Thema ein, lässt die Klasse selbstständig arbeiten oder diskutieren und sichert die Ergebnisse in einem gemeinsamen Tafelbild.</p>'
      +'<div class="meta-row">'
        +'<div><b>Lehrplangrundlage:</b>&nbsp;'+esc(KURS.grundlage)+'</div>'
        +'<div><b>Material-Ordner:</b>&nbsp;'+esc(KURS.ordner)+'</div>'
      +'</div>'
    +'</div>'

    +'<div class="card">'
      +'<h2>Aufbau jeder Unterrichtseinheit</h2>'
      +'<div class="structure-row">'
        +'<div class="structure-item"><div class="num">01</div><h3>Einstieg</h3><p>Ein Impuls, Beispiel oder eine Fallgeschichte führt in das neue Thema der Stunde ein.</p></div>'
        +'<div class="structure-item"><div class="num">02</div><h3>Arbeitsauftrag oder Diskussion</h3><p>Die Klasse erarbeitet die Inhalte selbstständig oder führt eine moderierte Diskussion.</p></div>'
        +'<div class="structure-item"><div class="num">03</div><h3>Tafelbild</h3><p>Ein gemeinsames Tafelbild mit Merksatz sichert die Ergebnisse der Stunde.</p></div>'
      +'</div>'
    +'</div>'

    +'<div class="grid-2">'
      +'<div class="card">'
        +'<h2>Kompetenzerwartungen des Lehrplans</h2>'
        +'<ul>'+kompHtml+'</ul>'
      +'</div>'
      +'<div class="card">'
        +'<h2>Stundenverteilung nach Themenblock</h2>'
        +'<div class="chart-bar">'+chartSegs+'</div>'
        +'<div class="legend-row">'+legend+'</div>'
      +'</div>'
    +'</div>';

    document.getElementById("main").innerHTML = html;
  }

  // ---------------- Lesson detail ----------------
  function materialIcon(){
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>';
  }

  function renderTafelbild(tb){
    var boxes = tb.boxen.map(function(box){
      var lis = box.punkte.map(function(p){ return "<li>"+esc(p)+"</li>"; }).join("");
      return '<div class="tafel-box"><h4>'+esc(box.ueberschrift)+'</h4><ul>'+lis+'</ul></div>';
    }).join("");
    return ''
    +'<div class="tafelbild-wrap">'
      +'<div class="tafelbild-title">◱ Tafelbild — „'+esc(tb.titel)+'"</div>'
      +'<div class="tafel-boxes">'+boxes+'</div>'
      +'<div class="merksatz"><b>Merksatz:</b> '+esc(tb.merksatz)+'</div>'
    +'</div>';
  }

  function renderLesson(nr){
    var s = findLesson(nr);
    if(!s){ renderOverview(); return; }
    var b = blockTitle(s.block);
    var done = !!state.taught[s.nr];
    var artBadgeClass = s.art_erarbeitung === "Diskussion" ? "disk" : "arbeit";
    var materialHtml = s.material.map(function(m){
      return '<div class="material-item">'+materialIcon()+'<span>'+esc(m)+'</span></div>';
    }).join("");

    var idx = STUNDEN.findIndex(function(x){return x.nr===nr;});
    var prev = idx>0 ? STUNDEN[idx-1] : null;
    var next = idx<STUNDEN.length-1 ? STUNDEN[idx+1] : null;

    var html = ''
    +'<div class="lesson-head">'
      +'<div class="lesson-head-left">'
        +'<div class="block-tag"><span class="block-dot" style="background:'+BLOCK_COLOR[s.block]+'"></span>Block '+s.block+' · '+esc(b.titel)+' · Stunde '+s.nr+' / 18</div>'
        +'<h1>'+esc(s.titel)+'</h1>'
      +'</div>'
      +'<button class="taught-toggle'+(done?" on":"")+'" id="taughtBtn">'+(done?"✓ Unterrichtet":"Als unterrichtet markieren")+'</button>'
    +'</div>'

    +'<div class="time-chips">'
      +'<span class="badge '+artBadgeClass+'">'+esc(s.art_erarbeitung)+'</span>'
      +'<span class="time-chip">Einstieg '+s.zeiten.einstieg+' min</span>'
      +'<span class="time-chip">'+esc(s.art_erarbeitung)+' '+s.zeiten.erarbeitung+' min</span>'
      +'<span class="time-chip">Sicherung '+s.zeiten.sicherung+' min</span>'
      +'<span class="time-chip">= 45 min</span>'
    +'</div>'

    +'<div class="card" style="margin-top:22px;">'
      +'<div class="info-card">'
        +'<dt>Kompetenzbezug</dt><dd>'+esc(s.kompetenzbezug)+'</dd>'
        +'<dt>Lehrplan-Inhalte</dt><dd>'+esc(s.lehrplan_inhalte.join(" · "))+'</dd>'
        +'<dt>Lernziel</dt><dd>'+esc(s.lernziel)+'</dd>'
        +'<dt>Sozialform</dt><dd>'+esc(s.sozialform)+'</dd>'
        +'<dt>Material im Ordner</dt><dd><div class="material-list">'+materialHtml+'</div></dd>'
      +'</div>'
    +'</div>'

    +'<div class="card">'
      +'<h2>Stundenverlauf</h2>'
      +'<div class="flow">'
        +'<div class="flow-step">'
          +'<div class="flow-rail"><div class="flow-dot">'+s.zeiten.einstieg+'&rsquo;</div><div class="flow-line"></div></div>'
          +'<div class="flow-body"><h3>Einstieg</h3><div class="flow-meta">Hinführung zum Thema</div><p>'+esc(s.einstieg)+'</p></div>'
        +'</div>'
        +'<div class="flow-step">'
          +'<div class="flow-rail"><div class="flow-dot">'+s.zeiten.erarbeitung+'&rsquo;</div><div class="flow-line"></div></div>'
          +'<div class="flow-body"><h3>'+esc(s.art_erarbeitung)+'</h3><div class="flow-meta">'+esc(s.sozialform)+'</div><p>'+esc(s.erarbeitung)+'</p></div>'
        +'</div>'
        +'<div class="flow-step">'
          +'<div class="flow-rail"><div class="flow-dot">'+s.zeiten.sicherung+'&rsquo;</div></div>'
          +'<div class="flow-body"><h3>Sicherung</h3><div class="flow-meta">Ergebnissicherung im Tafelbild</div>'+renderTafelbild(s.tafelbild)+'</div>'
        +'</div>'
      +'</div>'
      +(s.hausaufgabe ? '<div class="hw"><b>Hausaufgabe/Ausblick:</b> '+esc(s.hausaufgabe)+'</div>' : '')
    +'</div>'

    +'<div class="pager">'
      +'<button id="prevBtn" '+(prev?"":"disabled")+'>'+(prev?('<div class="lbl">← Vorherige Stunde</div>'+esc(prev.titel)):'')+'</button>'
      +'<button id="nextBtn" class="next" '+(next?"":"disabled")+'>'+(next?('<div class="lbl">Nächste Stunde →</div>'+esc(next.titel)):'')+'</button>'
    +'</div>';

    document.getElementById("main").innerHTML = html;

    var taughtBtn = document.getElementById("taughtBtn");
    if(taughtBtn) taughtBtn.addEventListener("click", function(){
      state.taught[s.nr] = !state.taught[s.nr];
      saveTaught(); renderSidebar(); renderLesson(s.nr);
    });
    var prevBtn = document.getElementById("prevBtn");
    if(prevBtn && prev) prevBtn.addEventListener("click", function(){ goTo(prev.nr); });
    var nextBtn = document.getElementById("nextBtn");
    if(nextBtn && next) nextBtn.addEventListener("click", function(){ goTo(next.nr); });
  }

  function goTo(nr){
    state.view="lesson"; state.lessonNr=nr;
    renderSidebar(); renderMain();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderMain(){
    if(state.view==="lesson" && state.lessonNr!=null){ renderLesson(state.lessonNr); }
    else{ state.view="overview"; renderOverview(); }
    updateProgress();
  }

  function updateProgress(){
    var total = STUNDEN.length, done = taughtCount();
    var pct = total ? (done/total*100) : 0;
    var fill = document.getElementById("progressFill");
    var label = document.getElementById("progressLabel");
    if(fill) fill.style.width = pct+"%";
    if(label) label.textContent = done+" / "+total+" Std.";
  }

  function closeSidebarMobile(){
    document.getElementById("sidebar").classList.remove("open");
  }

  // ---------------- Topbar (built once) ----------------
  function buildTopbar(){
    var bar = document.createElement("div");
    bar.className = "topbar";
    bar.innerHTML = ''
      +'<button class="menu-btn" id="menuBtn" aria-label="Menü">☰</button>'
      +'<div class="brand"><span class="eyebrow">WR 10</span><h1>Ökonomisches Handeln auf dem Markt</h1></div>'
      +'<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><span class="progress-label mono" id="progressLabel">0 / 18 Std.</span></div>';
    document.body.insertBefore(bar, document.querySelector(".app"));
    document.getElementById("menuBtn").addEventListener("click", function(){
      document.getElementById("sidebar").classList.toggle("open");
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    buildTopbar();
    document.getElementById("overviewBtn").addEventListener("click", function(){
      state.view="overview"; state.lessonNr=null;
      renderSidebar(); renderMain(); closeSidebarMobile();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    document.getElementById("search").addEventListener("input", function(e){
      state.query = e.target.value.trim();
      renderSidebar();
    });
    renderSidebar();
    renderMain();
  });
})();
</script>
